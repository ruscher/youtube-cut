[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "youtube-cut"
version = "0.1.0"
description = "Encontra quando um termo é dito nos vídeos do YouTube e corta esses trechos."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "yt-dlp>=2025.11.12",
    "PySide6>=6.6",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
youtube-cut = "youtube_cut.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
youtube_cut = ["gui/qml/*.qml", "gui/qml/qmldir", "gui/qml/assets/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
